<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selected Works — Video Stage</title>

  <!-- 字体自托管：原 Google Fonts CDN 国内加载失败会回退系统字体，改为本地 woff2 -->
  <link rel="preload" href="assets/fonts/fira-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/lexend-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link href="assets/fonts/fonts.css" rel="stylesheet" />

  <link rel="stylesheet" href="video-stage.css?v=20261011z" />
</head>

<body>
  <div class="stage-scale" id="stageScale">
    <!-- 3D 卡片舞台：居中、最大 1440，与主页容器对齐 -->
    <div class="stage" id="stage">
      <header class="site-nav">
        <div class="site-nav__logo">
          <div class="site-nav__logo-name">LI SHUAI</div>
          <div class="site-nav__logo-role">INDEPENDENT VISUAL DESIGNER</div>
        </div>
        <nav class="site-nav__menu">
          <a href="#" class="is-active">WORK</a>
          <a href="#">SERVICES</a>
          <a href="#">EXPERIENCE</a>
          <a href="#">ABOUT</a>
          <a href="#">CONTACT</a>
        </nav>
      </header>

      <div class="gallery" id="gallery"></div>

      <!-- 细装饰线：左上 → 右下，纯描边、无发光；绿色圆点沿线滑动 -->
      <svg class="stage-deco" viewBox="0 0 1972 798" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path class="stage-deco__line" d="M 75 170 C 240 210, 340 330, 560 415 C 760 490, 1000 430, 1280 300 C 1520 190, 1700 260, 1875 590" />
        <circle class="stage-deco__node" r="4.5" cx="75" cy="170" />
      </svg>
    </div>

    <!-- 文案层：z-index 刻意压在大卡片（.stage z:1）之下 ——
         用户 2026-09-19：卡片放大时「VIDEO SHOWCASE」等文字不该盖在视频上面。
         注意不能直接把 .stage-overlay 整层降级：那层里还有声音/箭头/导航点等控件，
         降下去按钮就点不动了（2026-09-03 踩过）。所以拆成两层：
         文案（本层，低） + 控件（下面的 .stage-overlay，高）。 -->
    <div class="stage-copy" id="stageCopy">
      <div class="stage-inner">
        <div class="intro" id="intro">
          <div class="intro__eyebrow">/ VIDEO WORKS</div>
          <h1 class="intro__title">VIDEO<br /><span>SHOWCASE</span></h1>
          <h2 class="intro__sub">影像，让创意发声</h2>
          <p class="intro__desc">
            用视觉讲述品牌故事，<br />
            让每一帧都充满力量与情绪。
          </p>
        </div>

        <button class="intro__cta intro__cta--stage-bottom" type="button">
          <span class="intro__cta-icon">↗</span>
          <span class="intro__cta-text">EXPLORE MORE</span>
          <span class="intro__cta-line"></span>
        </button>
      </div>
    </div>

    <!-- 控件层：必须整体压在 .stage(z:1) 之上，否则内部按钮会被舞台吃掉点击 -->
    <div class="stage-overlay" id="stageOverlay">
      <div class="stage-inner">
        <aside class="info" id="info">
          <div class="info__body">
            <div class="info__count"><span id="infoIndex">01</span><em>/ 05</em></div>
            <div class="info__type" id="infoType">BRAND VIDEO</div>
          </div>
        </aside>
        <div class="info__rail" id="infoRail"></div>

        <footer class="foot">
          <div class="foot__tagline">VIDEO · BRAND · PRODUCT · MOTION</div>
        </footer>

        <div class="sound" id="soundBar">
          <button class="sound__btn sound__btn--mute" id="soundBtn" type="button" aria-pressed="true">🔊</button>
          <button class="sound__btn sound__btn--prev" id="prevBtn" type="button" aria-label="上一个">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="sound__btn sound__btn--next" id="nextBtn" type="button" aria-label="下一个">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="gsap.min.js?v=20260903d"></script>
    <!-- 出场调节器（2026-10-15 v2）：逐卡调「从哪出现」+ 角度/缩放 + 两个预设。
       ⚠️ 必须放在 video-stage.js 的 <script> 之前 —— 脚本直接执行、不等 DOMContentLoaded。 -->
  <button class="en-fab" id="enFab" type="button" title="出场动画调节">⚙ 出场调节</button>
  <div class="en-panel" id="enPanel" hidden>
    <div class="en-panel__hd">出场动画调节<button id="enClose" type="button" title="收起">×</button></div>

    <div class="en-btns">
      <button class="en-btn" id="enPresetSide" type="button">两侧分布</button>
      <button class="en-btn" id="enPresetBehind" type="button">大卡后堆叠</button>
    </div>
    <label class="en-row">出屏距离（点「两侧分布」用）<b id="enOutV"></b>
      <input type="range" id="enOut" min="0" max="2400" step="20" value="1240"></label>

    <div class="en-seg" id="enCards">
      <button class="en-seg__b is-on" data-card="1" type="button">卡 1</button>
      <button class="en-seg__b" data-card="2" type="button">卡 2</button>
      <button class="en-seg__b" data-card="3" type="button">卡 3</button>
      <button class="en-seg__b" data-card="4" type="button">卡 4</button>
    </div>

    <label class="en-row">起始 X（在哪出现）<b id="enDxV"></b>
      <input type="range" id="enDx" min="-2400" max="2400" step="10" value="-1240"></label>
    <label class="en-row">起始 Y（上下位置）<b id="enDyV"></b>
      <input type="range" id="enDy" min="-900" max="900" step="10" value="0"></label>
    <label class="en-row">起始角度<b id="enRotV"></b>
      <input type="range" id="enRot" min="-180" max="180" step="1" value="-26"></label>
    <label class="en-row">起始缩放<b id="enScaleV"></b>
      <input type="range" id="enScale" min="0.2" max="1.4" step="0.02" value="0.72"></label>

    <label class="en-chk" title="性能 A/B 用：关掉后只剩位移动画"><input type="checkbox" id="enFx" checked> 抛洒效果（旋转 + 缩放）</label>

    <div class="en-btns">
      <button class="en-btn en-btn--go" id="enHome" type="button">回到固定位置</button>
      <button class="en-btn" id="enPreview" type="button">预览起始态</button>
    </div>
    <div class="en-btns">
      <button class="en-btn en-btn--copy" id="enCopy" type="button">复制参数（发给助手）</button>
      <button class="en-btn" id="enReset" type="button">恢复默认</button>
    </div>
    <div class="en-tip">先用左上预设（两侧分布 / 大卡后堆叠）生成起手式，再选「卡 1~4」逐张微调它从哪出现、角度和缩放。
      调好点「复制参数」发给助手即可固化。</div>
  </div>
<script src="video-stage.js?v=20261011z"></script>
</body>
</html>
